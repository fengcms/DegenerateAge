  <linearGradient id="darkBar" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#20282C"/><stop offset="1" stop-color="#0A1013"/></linearGradient>
  <filter id="softShadow" x="-25%" y="-50%" width="150%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
