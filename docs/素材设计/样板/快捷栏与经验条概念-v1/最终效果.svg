  <linearGradient id="socket" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#283137"/><stop offset="0.45" stop-color="#11191C"/><stop offset="1" stop-color="#0B1115"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#F2DDA2"/><stop offset="0.24" stop-color="#BBA16B"/><stop offset="0.6" stop-color="#735C3C"/><stop offset="1" stop-color="#D2B778"/></linearGradient>
  <linearGradient id="redPotion" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#F5786E"/><stop offset="0.45" stop-color="#BE383F"/><stop offset="1" stop-color="#601C2E"/></linearGradient>
  <linearGradient id="bluePotion" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#B4F4F4"/><stop offset="0.4" stop-color="#45AFD2"/><stop offset="1" stop-color="#235074"/></linearGradient>
