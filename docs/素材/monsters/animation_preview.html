manifest.actors.forEach(a=>{const o=document.createElement('option');o.value=a.id;o.textContent=a.name;actor.append(o);});
function loadActor(){current=manifest.actors.find(a=>a.id===actor.value);state.innerHTML='';for(const [key,s] of Object.entries(current.states)){const o=document.createElement('option');o.value=key;o.textContent=s.name;state.append(o);}loadState();}
function loadState(){animation=current.states[state.value];frame=0;elapsed=0;playing=true;play.textContent='暂停';scrub.max=animation.frames_per_direction-1;scrub.value=0;const token=++loadToken;img=null;const next=new Image();next.onload=()=>{if(token===loadToken){img=next;draw();}};next.src='../'+animation.atlas;
 document.querySelector('#meta').textContent=current.name+' · '+animation.name+' · '+current.frame_size.join('×')+' PNG · '+animation.frames_per_direction+' 帧/方向 · '+animation.fps+' FPS · '+(animation.loop?'循环播放':'单次播放，末帧停留')+' · 锚点 ('+current.pivot.join(',')+')';

function tick(now){const dt=last?Math.min((now-last)/1000,.1):0;last=now;if(playing&&img){elapsed+=dt*Number(speed.value);const next=Math.floor(elapsed*animation.fps);const f=animation.loop?next%animation.frames_per_direction:Math.min(next,animation.frames_per_direction-1);if(frame!==f){frame=f;draw();}if(!animation.loop&&next>=animation.frames_per_direction){playing=false;play.textContent='播放';}}requestAnimationFrame(tick);}
actor.onchange=loadActor;state.onchange=loadState;play.onclick=()=>{playing=!playing;if(playing&&!animation.loop&&frame===animation.frames_per_direction-1){elapsed=0;frame=0;}play.textContent=playing?'暂停':'播放';};document.querySelector('#replay').onclick=()=>{elapsed=0;frame=0;playing=true;play.textContent='暂停';draw();};scrub.oninput=()=>{frame=Number(scrub.value);elapsed=frame/animation.fps;playing=false;play.textContent='播放';draw();};document.querySelector('#bg').onclick=()=>{light=!light;document.body.classList.toggle('light',light);draw();};loadActor();requestAnimationFrame(tick);
